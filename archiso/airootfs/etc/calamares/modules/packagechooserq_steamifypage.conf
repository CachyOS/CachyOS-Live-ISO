# Steamify: its page (the app's switches, /usr/local/share/steamify-installer/
# SteamifyPage.qml). Legacy method: the page's choice (the ids that are on,
# plus "boot" for Boot into Desktop) goes to global storage as
# packagechooser_steamifypage, for shellprocess_steamify.conf.
---
method: legacy
qmlFilename: /usr/local/share/steamify-installer/SteamifyPage.qml
labels:
    step: "Steamify"
packageChoice: gaming,theme,glyphs,single,launcher,notify,vram,cec,machine,poweroff
