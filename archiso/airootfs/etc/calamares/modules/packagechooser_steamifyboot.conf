# Steamify: where the Steam Machine starts (steamify-install passes --boot).
---
mode: required
method: legacy
labels:
    step: "Start in"
default: gamescope
items:
    - id: gamescope
      name: "Gaming mode"
      description: "Start straight into Steam's gaming mode, like SteamOS. Switch to Desktop in Steam's power menu brings you to the desktop."
