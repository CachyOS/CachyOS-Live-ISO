# Steamify: which parts of the Steam Machine setup to leave out. Nothing
# selected means Steamify's full default setup; the ids are Steamify's menu
# items (steamify-install passes them as --skip).
---
mode: optionalmultiple
method: legacy
labels:
    step: "Steam Machine"
items:
    - id: ""
      name: "Everything"
      description: "Select what to leave out of the Steam Machine setup (Steamify). Leave everything unselected for the full SteamOS-style setup; everything can be changed later in the Steamify app."
      screenshot: ":/images/no-selection.png"
    - id: theme
      name: "Leave out: SteamOS theme"
      description: "The Vapor look for the desktop, with SteamOS's panel layout and Add to Steam."
    - id: glyphs
      name: "Leave out: Steam Deck/Machine icons"
      description: "Steam Deck button icons in gaming mode."
    - id: single
      name: "Leave out: single user mode"
      description: "No password, lock screen, user switching or log out, like SteamOS."
    - id: launcher
      name: "Leave out: Steamify shortcut"
      description: "The Steamify app on the desktop and in the launcher, to change these choices later."
    - id: notify
      name: "Leave out: update notifications"
      description: "A notification when there's a new Steamify. It never updates by itself."
    - id: vram
      name: "Leave out: VRAM booster"
      description: "The game in front keeps its video memory; background apps make room."
    - id: cec
      name: "Leave out: HDMI-CEC"
      description: "Use Steam with the TV remote, TV on and off with the Steam Machine."
    - id: machine
      name: "Leave out: Steam Machine support"
      description: "The LED bar driver, hardware settings in Steam and the power-off fix."
